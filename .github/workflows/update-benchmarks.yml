name: Update benchmark scores

on:
  schedule:
    - cron: "0 6 * * 1"   # wöchentlich, montags 06:00 UTC
  workflow_dispatch:        # manueller Start über den Actions-Tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Update benchmarks.json
        run: python API/update_benchmarks.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add benchmarks.json
          if git diff --cached --quiet; then
            echo "Keine Score-Änderungen."
          else
            git commit -m "data: update benchmark scores $(date -u +%F)"
            git push
          fi
